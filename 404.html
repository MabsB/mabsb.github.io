<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – Bernabe Bertiz Maboloc Jr.</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A111D">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    /* Self-contained so it works at any address. */
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background-color: #0a111d;
      background-image: radial-gradient(rgba(147, 165, 189, 0.15) 1px, transparent 1.25px);
      background-size: 22px 22px;
      color: #e6edf6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
    }
    main { max-width: 32rem; }
    .code { color: #7fd3ec; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85rem; letter-spacing: 0.04em; margin: 0 0 0.75rem; }
    h1 { margin: 0; font-size: clamp(2.2rem, 1.4rem + 3.5vw, 3.2rem); font-weight: 750; line-height: 1.05; letter-spacing: -0.035em; }
    p { color: #bac7d8; margin: 1rem 0 0; }
    a.btn {
      display: inline-flex; align-items: center; min-height: 46px; margin-top: 1.75rem;
      padding: 0.65rem 1.15rem; border-radius: 10px; background: #5cc4e3; color: #04202d;
      font-weight: 600; text-decoration: none;
    }
    a.btn:hover { background: #8ad8ef; }
    a:focus-visible { outline: 2px solid #5cc4e3; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">ERROR 404</p>

    <!-- Project site (e.g. /portfolio/)? Change href="/" to href="/portfolio/". -->
    <a class="btn" href="/">Go to the homepage</a>
  </main>
</body>
</html>
